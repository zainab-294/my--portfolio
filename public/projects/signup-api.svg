<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <!-- Background -->
  <rect width="800" height="450" fill="#FAF7FB"/>
  <rect x="20" y="20" width="760" height="410" rx="16" fill="#FFFFFF" stroke="#EEDBEE" stroke-width="2"/>
  
  <!-- Browser Header Bar -->
  <rect x="20" y="20" width="760" height="48" rx="16" fill="#FDF3F9"/>
  <rect x="20" y="52" width="760" height="16" fill="#FDF3F9"/>
  <line x1="20" y1="68" x2="780" y2="68" stroke="#EEDBEE" stroke-width="1.5"/>
  <circle cx="50" cy="44" r="6" fill="#FFC0DE"/>
  <circle cx="70" cy="44" r="6" fill="#ED96D7"/>
  <circle cx="90" cy="44" r="6" fill="#C654C3"/>
  <rect x="130" y="34" width="360" height="20" rx="6" fill="#FFFFFF" stroke="#EEDBEE"/>
  <text x="145" y="48" font-family="sans-serif" font-size="10" fill="#7A5785">https://api.dev/v1/auth/signup [IN PROGRESS]</text>

  <!-- Left: Client Signup Form Mockup -->
  <rect x="60" y="90" width="310" height="315" rx="14" fill="#FAF7FB" stroke="#EEDBEE"/>
  <rect x="80" y="110" width="90" height="20" rx="10" fill="#FFF3E0"/>
  <text x="92" y="124" font-family="sans-serif" font-size="10" font-weight="bold" fill="#B25E00">IN PROGRESS</text>
  <text x="80" y="155" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1E0A24">Create Account</text>
  
  <text x="80" y="185" font-family="sans-serif" font-size="11" font-weight="600" fill="#4A2854">Full Name</text>
  <rect x="80" y="195" width="270" height="32" rx="6" fill="#FFFFFF" stroke="#EEDBEE"/>
  <text x="92" y="216" font-family="sans-serif" font-size="11" fill="#1E0A24">Jordan Lee</text>

  <text x="80" y="248" font-family="sans-serif" font-size="11" font-weight="600" fill="#4A2854">Email Address</text>
  <rect x="80" y="258" width="270" height="32" rx="6" fill="#FFFFFF" stroke="#8E1EA2"/>
  <text x="92" y="279" font-family="sans-serif" font-size="11" fill="#1E0A24">jordan@example.com</text>

  <text x="80" y="311" font-family="sans-serif" font-size="11" font-weight="600" fill="#4A2854">Password Strength</text>
  <rect x="80" y="321" width="60" height="6" rx="3" fill="#81C784"/>
  <rect x="145" y="321" width="60" height="6" rx="3" fill="#81C784"/>
  <rect x="210" y="321" width="60" height="6" rx="3" fill="#81C784"/>
  <rect x="275" y="321" width="60" height="6" rx="3" fill="#E0E0E0"/>

  <rect x="80" y="348" width="270" height="38" rx="8" fill="#8E1EA2"/>
  <text x="175" y="372" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">Register</text>

  <!-- Right: Node / Express API Endpoint Representation -->
  <rect x="400" y="90" width="340" height="315" rx="14" fill="#1E0A24"/>
  <rect x="420" y="110" width="60" height="22" rx="6" fill="#8E1EA2"/>
  <text x="432" y="125" font-family="monospace" font-size="11" font-weight="bold" fill="#FFC0DE">POST</text>
  <text x="490" y="126" font-family="monospace" font-size="12" fill="#FAF7FB">/api/v1/auth/register</text>

  <rect x="420" y="150" width="300" height="235" rx="10" fill="#140618"/>
  <text x="435" y="180" font-family="monospace" font-size="11" fill="#ED96D7">// Express Router Controller</text>
  <text x="435" y="205" font-family="monospace" font-size="11" fill="#FAF7FB">router.post('/register',</text>
  <text x="455" y="225" font-family="monospace" font-size="11" fill="#FFC0DE">  validateRegistration,</text>
  <text x="455" y="245" font-family="monospace" font-size="11" fill="#C654C3">  async (req, res) =&gt; {</text>
  <text x="475" y="265" font-family="monospace" font-size="11" fill="#FAF7FB">    const { email } = req.body;</text>
  <text x="475" y="285" font-family="monospace" font-size="11" fill="#ED96D7">    // Status: Developing mock</text>
  <text x="475" y="305" font-family="monospace" font-size="11" fill="#81C784">    res.status(201).json({</text>
  <text x="495" y="325" font-family="monospace" font-size="11" fill="#FAF7FB">      ok: true, id: 'usr_mock'</text>
  <text x="475" y="345" font-family="monospace" font-size="11" fill="#81C784">    });</text>
  <text x="455" y="365" font-family="monospace" font-size="11" fill="#C654C3">  }</text>
  <text x="435" y="375" font-family="monospace" font-size="11" fill="#FAF7FB">);</text>
</svg>
